<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>DeepSeek Studio · 全家桶应用 API 工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234D6BFE'/><path d='M30 62c8 0 12-6 16-13s9-13 16-13' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-text">
        <strong>DeepSeek Studio</strong>
        <span>全家桶应用 API</span>
      </div>
      <button class="icon-btn" id="collapseSidebar" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建对话</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="conv-list" id="convList"></div>

    <div class="sidebar-foot">
      <button class="foot-btn" id="openSettings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span>设置</span>
      </button>
      <button class="foot-btn" id="toggleTheme">
        <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>主题</span>
      </button>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSidebar" aria-label="打开侧栏">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">新对话</div>
      <div class="topbar-actions">
        <span class="model-chip" id="modelChip">deepseek-flash</span>
        <button class="icon-btn" id="toggleSources" title="溯源面板" aria-label="溯源面板">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
        </button>
        <button class="icon-btn" id="exportBtn" title="导出 Markdown" aria-label="导出">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="messages" id="messages"></div>

      <!-- 空态 -->
      <div class="empty" id="empty">
        <div class="empty-logo">✦</div>
        <h1>把整个 DeepSeek App，搬进你的工作台</h1>
        <p>联网搜索、深度思考搜索、文件解析、阅读链接、语音输入与朗读、内容安全 —— 全部走 DeepSeek 官方全家桶应用 API。</p>
        <div class="empty-cards" id="emptyCards">
          <button class="ecard" data-prompt="帮我调研一下 DeepSeek 全家桶应用 API 新开放了哪些能力，和以前相比开发者能省掉哪些工作？">
            <span class="ecard-ico">🌐</span>
            <strong>联网调研</strong>
            <small>多查询词搜索 + 引用溯源</small>
          </button>
          <button class="ecard" data-prompt="深度对比一下 DeepSeek V4.1-Flash 和 V3.2 在 Agent 能力上的差异，请查阅官方文档与发布说明后给出结论。">
            <span class="ecard-ico">🧠</span>
            <strong>深度思考搜索</strong>
            <small>边推理边检索、打开网页求证</small>
          </button>
          <button class="ecard" data-prompt="我上传一份财报，你结合里面的图表，分析营收趋势和风险点。">
            <span class="ecard-ico">📄</span>
            <strong>文件解析</strong>
            <small>PDF / Office / 图片图文混排</small>
          </button>
          <button class="ecard" data-prompt="读一下 https://api-docs.deepseek.com/zh-cn/news/news261113/ ，然后用三句话讲清楚它的定价规则。">
            <span class="ecard-ico">🔗</span>
            <strong>阅读链接</strong>
            <small>自动抓取网页并结合上下文</small>
          </button>
        </div>
        <div class="empty-note">
          <span>提示：按 <kbd>/</kbd> 聚焦输入框，拖入文件即可上传</span>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="composer-wrap">
      <div class="drop-hint" id="dropHint">松开以上传文件</div>
      <form class="composer" id="composer">
        <div class="attachments" id="attachments"></div>
        <textarea id="input" rows="1" placeholder="问点什么…  可拖入 PDF / Word / PPT / 图片，或直接粘贴链接" autocomplete="off" spellcheck="false"></textarea>
        <div class="composer-bar">
          <div class="toggles">
            <button type="button" class="tg" id="tgThink" title="思考模式：开启后联网变为深度思考搜索">
              <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 00-3.5 10.9V17h7v-3.1A6 6 0 0012 3z"/><path d="M9.5 20h5"/></svg>
              <span>思考</span>
            </button>
            <button type="button" class="tg" id="tgSearch" title="联网搜索">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <span>联网</span>
            </button>
            <button type="button" class="tg" id="tgReadUrl" title="阅读消息中的链接">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7L13 18"/></svg>
              <span>读链接</span>
            </button>
            <button type="button" class="tg" id="tgSafety" title="模型内容安全（对外服务必须开启）">
              <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
              <span>安全</span>
            </button>
          </div>
          <div class="composer-right">
            <button type="button" class="icon-btn" id="attachBtn" title="上传文件">
              <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l8.5-8.5a3.7 3.7 0 015.2 5.2L10 18.4a1.8 1.8 0 01-2.6-2.6l8-8"/></svg>
            </button>
            <button type="button" class="icon-btn" id="micBtn" title="语音输入（ASR）">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
            </button>
            <button type="submit" class="send-btn" id="sendBtn" title="发送">
              <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3.5-6.5z"/></svg>
            </button>
          </div>
        </div>
      </form>
      <div class="composer-foot">
        <span id="usageMeter">就绪</span>
        <span class="dot">·</span>
        <span>模型判断是否联网；搜索与抓取在服务端完成</span>
      </div>
    </div>
  </main>

  <!-- ============ 溯源面板 ============ -->
  <aside class="sources" id="sourcesPanel">
    <div class="sources-head">
      <div>
        <strong>溯源 · Sources</strong>
        <span id="sourceCount">0</span>
      </div>
      <button class="icon-btn" id="closeSources" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sources-tabs">
      <button class="stab active" data-tab="sources">来源</button>
      <button class="stab" data-tab="trace">调用轨迹</button>
    </div>
    <div class="sources-body" id="sourcesBody"></div>
  </aside>

</div>

<!-- ============ 设置弹窗 ============ -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>设置</h2>
      <button class="icon-btn" id="closeSettings" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-label">DeepSeek API Key</span>
        <input type="password" id="setKey" placeholder="sk-…（仅保存在本机浏览器）" autocomplete="off">
        <small id="keyHint">留空则使用服务端环境变量 DEEPSEEK_API_KEY。</small>
      </label>

      <label class="field">
        <span class="field-label">模型</span>
        <input type="text" id="setModel" value="deepseek-flash">
        <small>全家桶应用能力目前由 <code>deepseek-flash</code>（V4.1-Flash）提供。</small>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">文档解析方式</span>
          <select id="setParsing">
            <option value="rich">图文混排（能看到图表）</option>
            <option value="text">纯文本（更省 Token）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">朗读音色</span>
          <select id="setVoice">
            <option value="stella">stella · 女声</option>
            <option value="tide">tide · 男声</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">安全等级</span>
          <select id="setSafety">
            <option value="high">high · 开启基础风控</option>
            <option value="low">low · 仅默认检查</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">会话标题</span>
          <select id="setTitle">
            <option value="on">自动生成</option>
            <option value="off">关闭</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span class="field-label">用户元信息（latest_reminder）</span>
        <input type="text" id="setLocale" placeholder="例如：上海，中文，2026-11-15">
        <small>把日期、所在地、语言告诉模型，回答更贴合你的环境。</small>
      </label>

      <div class="field">
        <span class="field-label">数据</span>
        <div class="btn-row">
          <button class="ghost-btn" id="exportAll">导出全部对话</button>
          <button class="ghost-btn" id="importAll">导入对话</button>
          <button class="ghost-btn danger" id="clearAll">清空全部</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <span id="healthHint"></span>
      <button class="primary-btn" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" multiple hidden
       accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tiff,.txt,.md,.csv,.json,.xlsx,.xls,.epub,.mobi">

<script src="md.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
